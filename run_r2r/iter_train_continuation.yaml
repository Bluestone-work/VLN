# Reliable continuation of the existing ETPNav R2R-CE release checkpoint.
# This is deliberately labelled SS-ETP/RL_TOPO, not official ETP-R1 GRPO:
# the local checkpoint uses the legacy BERT/SAP-head shapes.
BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: SS-ETP
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/logs/tensorboard_dirs/
CHECKPOINT_FOLDER: data/logs/checkpoints/
EVAL_CKPT_PATH_DIR: data/logs/checkpoints/
RESULTS_DIR: data/logs/eval_results/
VIDEO_DIR: data/logs/video/

ACTION_ABSTRACTION:
  LEVEL: default
  DIAGNOSTICS_ENABLED: True
  DIAGNOSTICS_PATH: data/logs/continuation_r2r_20261119/decisions.jsonl
  DIAGNOSTICS_MAX_RECORDS: 1000
  ORACLE_ENABLED: False
  GRAPH_SELECTION_ORACLE_ENABLED: False
  INCLUDE_RANKER_EMBEDDINGS: False
  TETP_ENABLED: False

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: 4
  CKPT_PATH_DIR: ''
  fast_eval: False

IL:
  iters: 12001
  log_every: 1
  lr: 1e-5
  batch_size: 1
  ml_weight: 1.0
  expert_policy: spl
  sample_ratio: 0.75
  decay_interval: 3000
  max_traj_len: 15
  max_text_len: 80
  loc_noise: 0.5
  waypoint_aug: False
  ghost_aug: 0.0
  back_algo: teleport
  tryout: True
  load_from_ckpt: True
  is_requeue: False
  ckpt_to_load: data/logs/checkpoints/release_r2r/ckpt.iter12000.pth

RL_TOPO:
  ENABLED: True
  DEBUG: True
  DEBUG_TRANSITIONS: False
  PROGRESS_WEIGHT: 1.0
  SUCCESS_REWARD: 5.0
  WRONG_STOP_PENALTY: 2.0
  GAMMA: 0.99
  GAE_LAMBDA: 0.95
  PPO_CLIP: 0.2
  VALUE_COEF: 0.5
  ENTROPY_COEF: 0.01
  PPO_EPOCHS: 1
  RESIDUAL_ALPHA: 0.1
  ACTOR_LR: 1e-5
  CRITIC_LR: 1e-4
  MAX_GRAD_NORM: 0.5

MODEL:
  task_type: r2r
  policy_name: PolicyViewSelectionETP
  NUM_ANGLES: 12
  pretrained_path: data/pretrained/ETP/mlm.sap_r2r/ckpts/model_step_82500.pt
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True
  merge_ghost: True
  consume_ghost: True
  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True
